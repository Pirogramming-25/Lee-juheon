{% extends 'ideas/base.html' %}

{% block content %}
<h1 class="page-title">개발툴 삭제</h1>

<p class="page-subtitle">
    {{ devtool.name }} 개발툴을 삭제하시겠습니까?
</p>

<div class="delete-actions">
    <form method="POST">
        {% csrf_token %}
        <button class="btn btn-delete" type="submit">삭제</button>
    </form>

    <a class="btn btn-list" href="{% url 'ideas:devtool-detail' devtool.pk %}">취소</a>
</div>
{% endblock %}
