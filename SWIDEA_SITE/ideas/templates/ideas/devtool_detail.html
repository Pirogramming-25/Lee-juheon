{% extends 'ideas/base.html' %}

{% block content %}
<div class="detail-card">
    <h1>{{ devtool.name }}</h1>

    <p class="meta">종류: {{ devtool.kind }}</p>
    <p>{{ devtool.content }}</p>

    <h2>이 개발툴을 사용하는 아이디어</h2>

    {% for idea in ideas %}
        <p>
            <a href="{% url 'ideas:idea-detail' idea.pk %}">
                {{ idea.title }}
            </a>
        </p>
    {% empty %}
        <p class="empty">이 개발툴을 사용하는 아이디어가 없습니다.</p>
    {% endfor %}

    <div class="detail-actions">
        <a class="btn" href="{% url 'ideas:devtool-update' devtool.pk %}">수정</a>
        <a class="btn danger" href="{% url 'ideas:devtool-delete' devtool.pk %}">삭제</a>
        <a class="btn gray" href="{% url 'ideas:devtool-list' %}">목록</a>
    </div>
</div>
{% endblock %}
