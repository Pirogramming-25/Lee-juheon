{% extends 'ideas/base.html' %}

{% block content %}
<h1 class="page-title">아이디어 삭제</h1>

<p class="page-subtitle">
    {{ idea.title }} 아이디어를 삭제하시겠습니까?
</p>

<div class="delete-actions">
    <form method="POST">
        {% csrf_token %}
        <button class="btn btn-delete" type="submit">삭제</button>
    </form>

    <a class="btn btn-list" href="{% url 'ideas:idea-detail' idea.pk %}">취소</a>
</div>
{% endblock %}
