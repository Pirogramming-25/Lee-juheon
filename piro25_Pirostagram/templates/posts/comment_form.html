{% extends "base.html" %}
{% load static %}

{% block title %}
    댓글 수정 | Pirostagram
{% endblock %}

{% block content %}
    <div class="form-page">
        <section class="form-card">
            <div class="form-card-header">
                <h1 class="form-card-title">댓글 수정</h1>

                <a href="{% url 'posts:detail' comment.post.id %}" class="form-card-cancel">
                    취소
                </a>
            </div>

            <form method="POST" class="comment-edit-form">
                {% csrf_token %}

                <div class="field-group">
                    {{ form.content }}

                    {% if form.content.errors %}
                        <div class="field-error">{{ form.content.errors }}</div>
                    {% endif %}
                </div>

                <button type="submit" class="btn-fill-blue">
                    수정 완료
                </button>
            </form>
        </section>
    </div>
{% endblock %}
